<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa el Resultado - Matemáticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<div class="portada">
    <span class="etiqueta">MATEMÁTICAS // VIDEOJUEGO</span>
    <h1>ATRAPA <span>EL RESULTADO</span></h1>
    <p>3ero Secundaria y Prepa | EXANI II - Haz clic en el globo con la respuesta correcta</p>
</div>

<div class="contenido">
    <div class="bloque" style="text-align:center;">

        <p style="font-weight:800; font-size:16px;">
            Tiempo: <span id="tiempo">60</span>s |
            Puntos: <span id="puntos">0</span> |
            Vidas: <span id="vidas">3</span> ❤️ |
            Racha: <span id="racha">0</span> 🔥
        </p>
        <p id="tipo" style="color:#8aa0c6;">Nivel: Secundaria 3ero - Operaciones básicas</p>

        <h2 id="pregunta" style="font-size:32px; margin:20px 0;">Presiona JUGAR</h2>

        <div id="area" style="position:relative; width:100%; height:400px; border:2px solid #2a3a65; border-radius:16px; overflow:hidden; background:#0d1430;">
            <div id="centro" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;">
                <button id="btn-jugar" class="btn-comprobar">JUGAR ▶</button>
                <p style="color:#8aa0c6; font-size:13px; margin-top:10px;">Los globos caen, atrapa solo el correcto</p>
            </div>
        </div>

        <br>
        <p>
            <button id="btn-secundaria" class="btn-aventura">Secundaria 3ero</button>
            <button id="btn-prepa" class="btn-aventura">Prepa</button>
        </p>

        <p id="fin" style="display:none; font-weight:800; font-size:18px;"></p>
        <p id="resultado" style="margin-top:10px; font-weight:800;"></p>


    </div>
</div>

<a href="{{ url_for('juegos_matematicas') }}" class="volver-orto">✦ Volver</a>

<!-- CONEXIÓN CON EL JS -->
<script src="{{ url_for('static', filename='js/atrapa_el_resultado.js') }}"></script>

</body>
</html>
